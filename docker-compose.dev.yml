# Local Postgres for development:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: thekinoloji
      POSTGRES_PASSWORD: thekinoloji
      POSTGRES_DB: thekinoloji
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
